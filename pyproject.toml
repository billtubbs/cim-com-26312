[build-system]
requires = ["setuptools"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "cim-com-2026"
version = "0.1.0"
description = "Simulations for 'Control Strategies for Smoothing and Blending Material Streams', CIM COM 2026, paper 26312"
authors = [
    {name = "Bill Tubbs", email = "tubbs.bill@spartancontrols.com"}
]
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "ipykernel==7.1.0",
    "numpy==2.3.4",
    "matplotlib==3.10.7",
    "pandas==2.3.3",
    "casadi==3.7.2",
    "sympy==1.14.0",
    "control==0.10.2",
    "scipy==1.16.3",
    "feed-concentration-control @ git+https://github.com/billtubbs/feed-conc-ctrl.git",
    "python-pid @ git+https://github.com/billtubbs/pid-ref.git#subdirectory=python_pid",
    "casadi-models @ git+https://github.com/billtubbs/casadi-models.git",
]
